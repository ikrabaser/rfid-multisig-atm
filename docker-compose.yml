# Yerel PostgreSQL (geliştirme). Kullanım:  docker compose up -d
# Varsayılan bağlantı ayarları backend/kasa/settings.py ile aynıdır (db: kasa, kullanıcı: kasa, parola: kasa).
# GERÇEK ortamda parolayı değiştir ve portu dışarı açma.
services:
  db:
    image: postgres:16
    container_name: kasa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kasa
      POSTGRES_USER: kasa
      POSTGRES_PASSWORD: kasa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kasa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasa -d kasa"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Banka Operasyon Simülasyonu canlı akışı (isteğe bağlı: kapalıysa panel 2 sn'de bir sorgulayarak güncellenir).
  # Geliştirme anahtarları backend/kasa/settings.py varsayılanlarıyla aynıdır; GERÇEK ortamda değiştir ve portu dışarı açma.
  centrifugo:
    image: centrifugo/centrifugo:v6
    container_name: kasa-centrifugo
    restart: unless-stopped
    command: centrifugo
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_HMAC_ANAHTARI:-gelistirme-centrifugo-hmac-anahtari-degistir}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_ANAHTARI:-gelistirme-centrifugo-api-anahtari}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "http://127.0.0.1:8000 http://localhost:8000"
      CENTRIFUGO_HTTP_SERVER_PORT: "8000"
    ports:
      - "127.0.0.1:8001:8000"

volumes:
  kasa-pgdata:
