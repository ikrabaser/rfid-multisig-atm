name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python testleri (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: kasa
          POSTGRES_USER: kasa
          POSTGRES_PASSWORD: kasa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kasa -d kasa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Migrasyon eksigi var mi?
        run: python manage.py makemigrations --check --dry-run
        env:
          POSTGRES_HOST: 127.0.0.1
      - name: Testler (esz zamanlilik testleri ve JS akis testi dahil)
        run: python manage.py test
        env:
          POSTGRES_HOST: 127.0.0.1

  sqlite:
    name: Hizli kontrol (SQLite, Python 3.10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: python manage.py test
        env:
          DB_ENGINE: sqlite
